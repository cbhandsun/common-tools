# Generated by DevFoundry; configured checks only, no deployment.
name: DevFoundry project CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: common-tools-windows
    timeout-minutes: 120
    steps:
      - uses: builtin:checkout
        with:
          persist-credentials: false
      - name: Native checks
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, ".devfleet/run_ci.py", "--expected-os", "Windows"], check=True)
  linux:
    runs-on: common-tools-linux
    timeout-minutes: 120
    steps:
      - uses: builtin:checkout
        with:
          persist-credentials: false
      - name: Native checks
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, ".devfleet/run_ci.py", "--expected-os", "Linux"], check=True)
  ci-complete:
    if: always()
    needs: [windows, linux]
    runs-on: common-tools-linux
    steps:
      - name: Require all selected native checks
        shell: python
        run: |
          results = ["${{ needs.windows.result }}", "${{ needs.linux.result }}"]
          if results != ["success", "success"]:
              raise SystemExit("Native CI gate failed: " + repr(results))
          print("Configured checks passed. Deployment and release approval are not provided by this workflow.")
