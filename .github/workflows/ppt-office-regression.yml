name: PowerPoint Office Regression

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      suite:
        description: Real PPTX corpus suite
        required: true
        default: full
        type: choice
        options:
          - full
          - smoke

permissions:
  contents: read

concurrency:
  group: ppt-office-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-office-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_office: ${{ steps.scope.outputs.run_office }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Select the bounded Office regression scope
        id: scope
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $changedFiles = @()
          if ($env:EVENT_NAME -in @('pull_request', 'push')) {
            if ($env:BASE_SHA -notmatch '^[a-f0-9]{40}$' -or $env:HEAD_SHA -notmatch '^[a-f0-9]{40}$') { throw 'Git comparison identity is invalid' }
            if ($env:BASE_SHA -eq ('0' * 40)) {
              $changedFiles = @('package.json')
            } elseif ($env:EVENT_NAME -eq 'pull_request') {
              $changedFiles = @(git diff --name-only "$($env:BASE_SHA)...$($env:HEAD_SHA)")
              if ($LASTEXITCODE -ne 0) { throw 'Unable to determine pull request changed files' }
            } else {
              $changedFiles = @(git diff --name-only $env:BASE_SHA $env:HEAD_SHA)
              if ($LASTEXITCODE -ne 0) { throw 'Unable to determine pushed changed files' }
            }
          }
          $changedFiles | node scripts/office-regression-scope.js --event $env:EVENT_NAME --github-output $env:GITHUB_OUTPUT

  real-pptx-quality:
    needs: detect-office-scope
    if: needs.detect-office-scope.outputs.run_office == 'true'
    runs-on: [self-hosted, Windows, X64, slideclone-office]
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh -NoProfile -NonInteractive -Command ". '{0}'"
    env:
      SLIDECLONE_REAL_PPTX_WORK_ROOT: ${{ vars.SLIDECLONE_REAL_PPTX_WORK_ROOT }}
      SLIDECLONE_QUALITY_HISTORY_ROOT: ${{ vars.SLIDECLONE_QUALITY_HISTORY_ROOT }}
      SLIDECLONE_OFFICE_PYTHON_BIN: ${{ vars.SLIDECLONE_OFFICE_PYTHON_BIN }}
      CORPUS_SUITE: ${{ github.event_name == 'pull_request' && 'smoke' || inputs.suite || 'full' }}
      TEST_REPORTER: dot
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate runner Python 3.12
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SLIDECLONE_OFFICE_PYTHON_BIN)) { throw "SLIDECLONE_OFFICE_PYTHON_BIN is required" }
          $pythonPath = [System.IO.Path]::GetFullPath($env:SLIDECLONE_OFFICE_PYTHON_BIN)
          if (-not (Test-Path -LiteralPath $pythonPath -PathType Leaf)) { throw "Configured Office Python executable is unavailable" }
          $pythonVersion = (& $pythonPath -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')").Trim()
          if ($LASTEXITCODE -ne 0 -or $pythonVersion -ne "3.12") { throw "Office Runner requires Python 3.12" }
          "PYTHON_BIN=$pythonPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Split-Path -Parent $pythonPath) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Identify locked Node dependency cache
        id: node-dependency-key
        env:
          RUNNER_TOOL_CACHE: ${{ runner.tool_cache }}
        run: node scripts/office-node-dependencies.js key

      - name: Restore exact Node dependencies
        id: node-dependencies
        if: steps.node-dependency-key.outputs.local_hit != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ steps.node-dependency-key.outputs.key }}

      - name: Validate or install locked Node dependencies
        env:
          RUNNER_TOOL_CACHE: ${{ runner.tool_cache }}
          OFFICE_NODE_CACHE_KEY: ${{ steps.node-dependency-key.outputs.key }}
          OFFICE_NODE_LOCAL_CACHE_HIT: ${{ steps.node-dependency-key.outputs.local_hit }}
          OFFICE_NODE_CACHE_HIT: ${{ steps.node-dependency-key.outputs.local_hit == 'true' && 'true' || steps.node-dependencies.outputs.cache-hit }}
        run: node scripts/office-node-dependencies.js prepare

      - name: Save validated Node dependencies
        if: steps.node-dependencies.outputs.cache-hit != 'true' && steps.node-dependency-key.outputs.local_hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ steps.node-dependency-key.outputs.key }}

      - name: Prepare cached Python runtimes
        env:
          RUNNER_TOOL_CACHE: ${{ runner.tool_cache }}
        run: |
          npm run slideclone:bootstrap-python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run slideclone:bootstrap-paddleocr
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate cached runtimes and build locked .NET dependencies
        run: |
          npm run slideclone:smoke-paddleocr
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run audit:dotnet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:dotnet:locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore visual quality history
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-state/ppt-quality-history-${{ env.CORPUS_SUITE }}.json
          key: ppt-quality-history-${{ runner.name }}-${{ env.CORPUS_SUITE }}-${{ github.run_id }}
          restore-keys: |
            ppt-quality-history-${{ runner.name }}-${{ env.CORPUS_SUITE }}-

      - name: Run serialized Office corpus and trend gate
        run: >-
          node scripts/run-office-ppt-regression.js
          --suite "$env:CORPUS_SUITE"

      - name: Upload bounded regression reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ppt-office-regression-${{ github.run_id }}
          path: |
            artifacts/ppt-office-regression/*.json
            artifacts/ppt-office-regression/cross-renderer/cross-renderer-report.json
            artifacts/ppt-office-regression/ppt-create-smoke/ppt-create-office-smoke-report.json
            artifacts/ppt-office-regression/ppt-create-smoke/powerpoint-editable-roundtrip-summary.json
            artifacts/ppt-office-regression/ppt-create-smoke/independent-corpus/powerpoint-editable-roundtrip-summary.json
          if-no-files-found: warn
          retention-days: 90

      - name: Save passing visual quality history
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-state/ppt-quality-history-${{ env.CORPUS_SUITE }}.json
          key: ppt-quality-history-${{ runner.name }}-${{ env.CORPUS_SUITE }}-${{ github.run_id }}

  office-regression-required:
    name: office-regression-required
    needs: [detect-office-scope, real-pptx-quality]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce the stable required-check result
        shell: bash
        env:
          DETECTION_RESULT: ${{ needs.detect-office-scope.result }}
          RUN_OFFICE: ${{ needs.detect-office-scope.outputs.run_office }}
          OFFICE_RESULT: ${{ needs.real-pptx-quality.result }}
        run: |
          set -euo pipefail
          test "${DETECTION_RESULT}" = "success"
          if test "${RUN_OFFICE}" = "true"; then
            test "${OFFICE_RESULT}" = "success"
          else
            test "${OFFICE_RESULT}" = "skipped"
          fi
