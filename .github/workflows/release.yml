name: immutable-release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: immutable-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Check out the immutable tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Validate tag and release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${version}"
          test "$(git rev-list -n 1 "${GITHUB_REF_NAME}")" = "${GITHUB_SHA}"
          repository="${GITHUB_REPOSITORY,,}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "remote_image=${REGISTRY}/${repository}/remote-mcp" >> "${GITHUB_OUTPUT}"
          echo "image_worker=${REGISTRY}/${repository}/image-to-editable-worker" >> "${GITHUB_OUTPUT}"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run release contract gates
        run: |
          npm run lint
          npm run typecheck
          npm run common-tools:verify-plugins
          npm run common-tools:verify-runtime-package
          npm run common-tools:verify-observability
          npm run common-tools:verify-adrs

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build and push Remote MCP image
        id: remote
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/docker/Dockerfile.remote-mcp
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.identity.outputs.remote_image }}:${{ steps.identity.outputs.version }}
            ${{ steps.identity.outputs.remote_image }}:sha-${{ github.sha }}

      - name: Build and push image-to-editable Worker image
        id: image_worker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/docker/Dockerfile.image-to-editable
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.identity.outputs.image_worker }}:${{ steps.identity.outputs.version }}
            ${{ steps.identity.outputs.image_worker }}:sha-${{ github.sha }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify immutable image digests
        shell: bash
        env:
          REMOTE_IMAGE: ${{ steps.identity.outputs.remote_image }}
          REMOTE_DIGEST: ${{ steps.remote.outputs.digest }}
          IMAGE_WORKER: ${{ steps.identity.outputs.image_worker }}
          IMAGE_WORKER_DIGEST: ${{ steps.image_worker.outputs.digest }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          issuer="https://token.actions.githubusercontent.com"
          for image in "${REMOTE_IMAGE}@${REMOTE_DIGEST}" "${IMAGE_WORKER}@${IMAGE_WORKER_DIGEST}"; do
            cosign sign --yes "${image}"
            cosign verify --certificate-identity "${identity}" --certificate-oidc-issuer "${issuer}" "${image}" >/dev/null
          done

      - name: Attest Remote MCP image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.identity.outputs.remote_image }}
          subject-digest: ${{ steps.remote.outputs.digest }}
          push-to-registry: true

      - name: Attest image Worker provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.identity.outputs.image_worker }}
          subject-digest: ${{ steps.image_worker.outputs.digest }}
          push-to-registry: true

      - name: Generate deployable release evidence
        shell: bash
        env:
          REMOTE_IMAGE: ${{ steps.identity.outputs.remote_image }}
          REMOTE_DIGEST: ${{ steps.remote.outputs.digest }}
          IMAGE_WORKER: ${{ steps.identity.outputs.image_worker }}
          IMAGE_WORKER_DIGEST: ${{ steps.image_worker.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm run common-tools:sbom -- --output artifacts/common-tools.spdx.json
          npm run common-tools:release-evidence -- --sbom artifacts/common-tools.spdx.json --output artifacts/common-tools.release.json --revision "${GITHUB_SHA}" --image "${REMOTE_IMAGE}@${REMOTE_DIGEST}" --image "${IMAGE_WORKER}@${IMAGE_WORKER_DIGEST}"
          npm run common-tools:verify-release-evidence -- --sbom artifacts/common-tools.spdx.json --manifest artifacts/common-tools.release.json
          cosign sign-blob --yes --bundle artifacts/common-tools.release.sigstore.json artifacts/common-tools.release.json
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          cosign verify-blob --bundle artifacts/common-tools.release.sigstore.json --certificate-identity "${identity}" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" artifacts/common-tools.release.json
          npm pack --pack-destination artifacts

      - name: Upload immutable release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ steps.identity.outputs.version }}
          if-no-files-found: error
          retention-days: 90
          path: |
            artifacts/common-tools.spdx.json
            artifacts/common-tools.release.json
            artifacts/common-tools.release.sigstore.json
            artifacts/common-tools-*.tgz

      - name: Create immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release already exists; refusing to overwrite immutable release" >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" artifacts/common-tools.spdx.json artifacts/common-tools.release.json artifacts/common-tools.release.sigstore.json artifacts/common-tools-*.tgz --verify-tag --generate-notes --title "Common Tools ${GITHUB_REF_NAME}"
