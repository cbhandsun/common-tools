name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      TEST_REPORTER: dot
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts

      - name: Run portable architecture and boundary tests
        run: npm run test:portable

  verify:
    needs: portable-core
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TEST_REPORTER: dot
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts

      - name: Verify common-tools static checks
        run: npm run lint && npm run typecheck

      - name: Verify standalone Codex and Claude plugin packages
        run: npm run common-tools:verify-plugins

      - name: Pack, install, and verify the release Runtime
        run: npm run common-tools:verify-runtime-package

      - name: Verify Team observability configuration
        run: npm run common-tools:verify-observability

      - name: Verify architecture decision records
        run: npm run common-tools:verify-adrs

      - name: Restore locked and audit NuGet dependencies
        run: npm run audit:dotnet

      - name: Build with warnings treated as errors
        run: npm run build:dotnet:locked

      - name: Run common-tools contract tests
        run: npm run common-tools:test

      - name: Generate reproducible SPDX SBOM
        shell: pwsh
        run: |
          npm run common-tools:sbom -- --output artifacts/common-tools.spdx.json
          npm run common-tools:release-evidence -- --sbom artifacts/common-tools.spdx.json --output artifacts/common-tools.release.json --revision "$env:GITHUB_SHA"
          npm run common-tools:verify-release-evidence -- --sbom artifacts/common-tools.spdx.json --manifest artifacts/common-tools.release.json

      - name: Upload SPDX SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: common-tools-spdx-sbom
          path: |
            artifacts/common-tools.spdx.json
            artifacts/common-tools.release.json
          if-no-files-found: error
          retention-days: 30

      - name: Run unit tests
        run: npm run test:unit

      - name: Run contract tests
        run: npm run test:contract

      - name: Run integration tests
        run: npm run test:integration

      - name: Verify hashed Python dependency lock
        run: npm run verify:python-lock
