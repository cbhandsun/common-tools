resolver 127.0.0.11 ipv6=off valid=10s;

server {
  listen 8080;
  server_tokens off;
  client_max_body_size 110m;

  location = /healthz {
    set $mcp_upstream remote-mcp;
    proxy_pass http://$mcp_upstream:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location = /readyz {
    set $mcp_upstream remote-mcp;
    proxy_pass http://$mcp_upstream:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location = /mcp {
    set $mcp_upstream remote-mcp;
    proxy_pass http://$mcp_upstream:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_request_buffering on;
  }

  location = /.well-known/oauth-protected-resource/mcp {
    set $mcp_upstream remote-mcp;
    proxy_pass http://$mcp_upstream:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Codex CLI 0.143-0.146 discards RFC 9207's callback `iss` parameter, then
  # rejects the callback because Keycloak honestly advertises support for it.
  # Keep Keycloak's callback parameter intact, but advertise this compatibility
  # view only at the public discovery endpoint so affected Codex clients do not
  # enable the broken required-issuer path. Remove once the client regression is
  # fixed upstream. The exact location must precede the broader /id/ proxy.
  location = /id/realms/common-tools/.well-known/openid-configuration {
    set $idp_upstream keycloak;
    proxy_pass http://$idp_upstream:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Accept-Encoding "";
    proxy_hide_header Content-Length;
    sub_filter_once on;
    sub_filter_types application/json;
    sub_filter '"authorization_response_iss_parameter_supported":true' '"authorization_response_iss_parameter_supported":false';
  }

  # Keycloak is reachable only under /id; its management port and endpoints
  # are not routed through this public gateway.
  location ^~ /id/ {
    set $idp_upstream keycloak;
    proxy_pass http://$idp_upstream:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Presigned URLs use path-style S3 addressing. The exact bucket route keeps
  # MinIO's API and console private; only GET, PUT and HEAD are forwarded. The
  # template substitutes the public authority before nginx starts: reverse
  # tunnels can rewrite Host to their loopback origin, while SigV4 signs Host.
  location ^~ /common-tools-artifacts/ {
    limit_except GET PUT HEAD { deny all; }
    set $object_store_upstream minio;
    proxy_pass http://$object_store_upstream:9000;
    proxy_http_version 1.1;
    proxy_set_header Host $COMMON_TOOLS_SINGLE_INGRESS_PUBLIC_HOST;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_request_buffering off;
    proxy_buffering off;
  }

  location / { return 404; }
}
