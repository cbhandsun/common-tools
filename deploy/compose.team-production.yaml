  image-to-editable-worker:
    build: !reset null
    # Compose interpolates every declared service before profile selection. Keep
    # this optional here so a ppt-quality-only deployment does not need an
    # unused image Worker reference; production preflight requires a digest
    # whenever image-to-editable is actually enabled.
    image: ${COMMON_TOOLS_IMAGE_WORKER_IMAGE:-}
    depends_on: !override
      team-migrate: { condition: service_completed_successfully }
    environment:
