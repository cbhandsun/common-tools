global:
  scrape_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/common-tools-alerts.yaml

scrape_configs:
  - job_name: common-tools-api
    scheme: http
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/common_tools_metrics_token
    static_configs:
      - targets:
          - remote-mcp:3000
