# Optional production overlay for Docker/Compose secret-file injection.
# Each *_FILE variable below is a host path consumed by Compose; the service
# receives only the corresponding /run/secrets path. Do not combine this
# overlay with direct credential environment variables for the same setting.
secrets:
  common_tools_database_user:
    file: ${COMMON_TOOLS_DATABASE_USER_FILE:?set database user secret file}
  common_tools_database_password:
    file: ${COMMON_TOOLS_DATABASE_PASSWORD_FILE:?set database password secret file}
  common_tools_redis_username:
    file: ${COMMON_TOOLS_REDIS_USERNAME_FILE:?set Redis username secret file}
  common_tools_redis_password:
    file: ${COMMON_TOOLS_REDIS_PASSWORD_FILE:?set Redis password secret file}
  common_tools_object_store_access_key_id:
    file: ${COMMON_TOOLS_OBJECT_STORE_ACCESS_KEY_ID_FILE:?set object-store access key ID secret file}
  common_tools_object_store_secret_access_key:
    file: ${COMMON_TOOLS_OBJECT_STORE_SECRET_ACCESS_KEY_FILE:?set object-store secret file}

services:
  team-migrate:
    secrets:
      - common_tools_database_user
      - common_tools_database_password
      - common_tools_redis_username
      - common_tools_redis_password
      - common_tools_object_store_access_key_id
      - common_tools_object_store_secret_access_key
    environment:
      COMMON_TOOLS_DATABASE_USER: !reset null
      COMMON_TOOLS_DATABASE_PASSWORD: !reset null
      COMMON_TOOLS_REDIS_USERNAME: !reset null
      COMMON_TOOLS_REDIS_PASSWORD: !reset null
      COMMON_TOOLS_OBJECT_STORE_ACCESS_KEY_ID: !reset null
      COMMON_TOOLS_OBJECT_STORE_SECRET_ACCESS_KEY: !reset null
      COMMON_TOOLS_DATABASE_USER_FILE: /run/secrets/common_tools_database_user
      COMMON_TOOLS_DATABASE_PASSWORD_FILE: /run/secrets/common_tools_database_password
      COMMON_TOOLS_REDIS_USERNAME_FILE: /run/secrets/common_tools_redis_username
      COMMON_TOOLS_REDIS_PASSWORD_FILE: /run/secrets/common_tools_redis_password
      COMMON_TOOLS_OBJECT_STORE_ACCESS_KEY_ID_FILE: /run/secrets/common_tools_object_store_access_key_id
      COMMON_TOOLS_OBJECT_STORE_SECRET_ACCESS_KEY_FILE: /run/secrets/common_tools_object_store_secret_access_key

