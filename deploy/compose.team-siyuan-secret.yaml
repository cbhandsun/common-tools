# Optional overlay used only when the siyuan-note capability is enabled.
secrets:
  common_tools_siyuan_token:
    file: ${COMMON_TOOLS_SIYUAN_TOKEN_FILE:?set SiYuan token secret file}

services:
  remote-mcp:
    secrets:
      - common_tools_siyuan_token
    environment:
      COMMON_TOOLS_SIYUAN_TOKEN: !reset null
      COMMON_TOOLS_SIYUAN_TOKEN_FILE: /run/secrets/common_tools_siyuan_token
