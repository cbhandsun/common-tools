<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SlideClone Review Studio</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">SLIDECLONE</p>
      <h1>Review Studio</h1>
    </div>
    <div class="toolbar">
      <label>页面 <select id="page-select" aria-label="选择页面"></select></label>
      <button id="apply" type="button" disabled>应用补丁</button>
    </div>
  </header>
  <main>
    <section class="stage-shell" aria-label="幻灯片审阅画布">
      <div id="stage" class="stage">
        <img id="source" alt="源页面">
        <div id="overlay"></div>
      </div>
      <p id="status" role="status">正在载入…</p>
    </section>
    <aside>
      <div class="panel-heading">
        <p class="eyebrow">SELECTED LAYER</p>
        <h2 id="selected-title">未选择</h2>
        <span id="selected-kind"></span>
      </div>
      <form id="inspector" autocomplete="off">
        <fieldset id="geometry-fields" disabled>
          <legend>几何（pt）</legend>
          <div class="grid-2">
            <label>X <input name="x" type="number" step="0.1"></label>
            <label>Y <input name="y" type="number" step="0.1"></label>
            <label>宽 <input name="w" type="number" step="0.1" min="0.01"></label>
            <label>高 <input name="h" type="number" step="0.1" min="0.01"></label>
          </div>
        </fieldset>
        <fieldset id="text-fields" disabled hidden>
          <legend>文字</legend>
          <label>内容 <textarea name="text" rows="5" maxlength="20000"></textarea></label>
          <div class="grid-2">
            <label>字体 <input name="family" maxlength="128"></label>
            <label>字号 <input name="sizePt" type="number" step="0.5" min="0.5" max="400"></label>
            <label>颜色 <input name="fontColor" placeholder="#112233"></label>
            <label>对齐 <select name="align"><option>left</option><option>center</option><option>right</option><option>justify</option></select></label>
          </div>
        </fieldset>
        <fieldset id="style-fields" disabled>
          <legend>样式</legend>
          <div class="grid-2">
            <label>填充 <input name="fill" placeholder="#112233 / none"></label>
            <label>描边 <input name="stroke" placeholder="#112233 / none"></label>
            <label>线宽 <input name="strokeWidthPt" type="number" step="0.1" min="0" max="100"></label>
            <label>透明度 <input name="opacity" type="number" step="0.05" min="0" max="1"></label>
          </div>
        </fieldset>
        <fieldset id="review-fields" disabled>
          <legend>审阅</legend>
          <label>状态 <select name="reviewStatus"><option value="open">open</option><option value="accepted">accepted</option><option value="needs-work">needs-work</option><option value="resolved">resolved</option></select></label>
          <label>备注 <textarea name="reviewNote" rows="4" maxlength="5000"></textarea></label>
        </fieldset>
      </form>
    </aside>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
